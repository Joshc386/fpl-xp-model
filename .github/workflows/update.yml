# Twice-daily pipeline: check out the newest upstream data, check it, build the outputs and
# publish them to outputs/ on main. Plan: docs/plans/task-6-workflows.md. No secrets.
name: update

on:
  schedule:
    - cron: "23 8 * * *"
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A manual run queues behind a scheduled one instead of overlapping it.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    # The job pushes to main, so a manual run on another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main's tip when the job starts, not the commit the run was queued at: a run
          # queued behind another one then sees the new meta.csv and skips.
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Check out upstream (the two seasons, no blobs until needed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: olbauday/FPL-Core-Insights
          path: data/raw/upstream/repo
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            data/2025-2026/By Gameweek
            data/2026-2027/By Gameweek
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: python -m pip install -r requirements.txt -e .

      - name: Decide whether to publish
        id: decide
        run: python -m fpl.publish_decision

      - name: Check the inputs and build the processed tables
        if: steps.decide.outputs.publish == 'true'
        run: python -m fpl.run_pipeline

      - name: Check and write the outputs to a scratch folder
        if: steps.decide.outputs.publish == 'true'
        run: python -m fpl.export --out-dir "$RUNNER_TEMP/outputs"

      # Reached only if both commands above exited 0. Commits outputs/ alone.
      - name: Commit and push outputs
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start from an empty folder so a file export stops writing is deleted too.
          rm -rf outputs
          mkdir outputs
          cp "$RUNNER_TEMP"/outputs/*.csv outputs/
          read -r SHA RUN_UTC < <(python -c "import csv; r = next(csv.DictReader(open('outputs/meta.csv', newline=''))); print(r['upstream_commit'], r['run_utc'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The token reaches git only through this helper, which reads it from the environment.
          git config credential.helper '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          git add -A -- outputs
          git commit \
            -m "chore: publish outputs for upstream ${SHA:0:7}" \
            -m "Upstream commit: ${SHA}
          run_utc: ${RUN_UTC}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for attempt in 1 2; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt ${attempt} failed"
            git rebase --abort || true
          done
          exit 1
