# Pipeline settings: upstream source, local paths, input-validation bounds.
# Owned by the data-engineer. Model settings live in model.yaml.

upstream:
  repo_url: https://github.com/olbauday/FPL-Core-Insights
  checkout_path: data/raw/upstream/repo   # local sparse checkout of the repo
  data_dir: data                          # folder inside the checkout holding the seasons

paths:
  processed_dir: data/processed           # tables go to {processed_dir}/{season}/

# One entry per season built. `tackles_column` is the playermatchstats column
# that holds FPL's tackle measure (docs/data_contract.md, source notes).
seasons:
  - id: 2025-2026
    gameweeks: 38
    tackles_column: tackles
  - id: 2026-2027
    gameweeks: 38
    tackles_column: tackles_won

# The season the published outputs describe (players.csv, fixture_difficulty.csv, meta.csv).
current_season: 2026-2027

# Upstream's tournament tag for the Premier League.
premier_league_tag: prem

# An as-of read holds the cup and European matches that kicked off before the next
# gameweek's deadline, which is its first Premier League kickoff minus this offset
# (exact for all 38 gameweeks of 2026/27). Derived from the schedule, never from master files.
loader:
  deadline_offset_minutes: 90

# players.position -> processed position.
position_map:
  Goalkeeper: GKP
  Defender: DEF
  Midfielder: MID
  Forward: FWD

# fact_player_match columns where a blank means zero in a complete match
# (brief data rule 15). Never applied to a column empty for the whole season.
fill_zero_columns:
  - goals
  - assists
  - xg
  - xa
  - pens_scored
  - pens_missed
  - tackles
  - interceptions
  - clearances
  - blocks
  - recoveries
  - saves

# Input validation bounds, [min, max] inclusive (brief section 11, step 4).
validation:
  teams_rows: [20, 20]
  # Per season: 38 gameweeks x 10 = 380. A postponed match with no gameweek folder
  # leaves a small shortfall, which passes with a warning.
  prem_matches_rows: [370, 380]
  matches_rows: [380, 700]                 # all competitions, per season
  players_rows_per_snapshot: [500, 1000]
  playerstats_rows_snapshot: [500, 1000]
  player_gameweek_stats_rows_per_gw: [500, 1000]
  playermatchstats_rows_per_match: [10, 60]
  now_cost_m: [3.0, 20.0]                  # GBP m, as upstream publishes it
  # fact_player_match rows dropped for a club that is not the match's (club_not_in_match) or
  # a player missing from the snapshot (player_not_in_snapshot): a mapping regression shows as
  # a jump. The cap is a share of the playermatchstats rows read, so it scales with as-of
  # reads, but never less than `always_allowed` rows (a small early read can have a stray
  # row or two). Real worst cases: 0.33% (2 of 615 rows, 2026/27 as-of 1) and 0.02% on a full
  # 2025/26 build; taking clubs from the latest snapshot gives 1.3%.
  max_dropped_rows:
    share: 0.005
    always_allowed: 5
  # fact_player_match rows per complete match, after the drops (real minimum 25).
  fact_player_match_rows_per_complete_match_min: 15

# Output validation bounds (brief section 11, step 8). Price and position bounds are shared with
# `validation.now_cost_m` and `position_map`.
output_validation:
  elo_rating_range: [1000, 2500]   # our Elo ratings; real values sit near 1500-2000
  lambda_max: 10                   # expected goals for or against in one fixture
  tolerance: 1.0e-9                # float tolerance for p_cs = exp(-lambda_against) and zero-sum Elo

# One-off pull of beyondELO's per-match club ratings (python -m fpl.beyondelo). An outside
# source for Josh's Elo check, never a model input (docs/data_contract.md, Outside sources).
# The key comes only from the environment variable BEYONDELO_API_KEY. The Premier League's
# competition code is not configured: it is confirmed from GET /competitions (the one entry with
# country England and tier domestic_league; the code is eng.1), because beyondELO does not
# document it, and the pull stops if that is not unambiguous.
beyondelo:
  base_url: https://public-api.beyondelo.com/v1
  seasons: [2025-2026, 2026-2027]            # ids as in `seasons` above and as beyondELO writes them
  per_page: 100                              # beyondELO's maximum
  max_requests: 20                           # hard cap per run, checked before every request
  min_seconds_between_requests: 6.5          # under the 10 a minute limit
  timeout_seconds: 30
  # Fail the build if more than this share of played, decided matches have a rating that moved
  # the wrong way (a label mix-up makes nearly all wrong; a margin-based Elo can lower a
  # narrow-winning favourite).
  max_wrong_direction_share: 0.5
  external_dir: data/external/beyondelo      # {season}.parquet, reconciliation.csv and raw/ below
  # beyondELO club name -> our dim_team.name, for names that differ, taken from the first real
  # pull (2026-11-17). An unmapped name fails the build and is listed.
  club_aliases:
    AFC Bournemouth: Bournemouth
    Brentford FC: Brentford
    Ipswich: Ipswich Town
    Leeds United: Leeds
    Manchester City: Man City
    Manchester United: Man Utd
    Newcastle United: Newcastle
    Nottingham Forest: "Nott'm Forest"
    Sunderland AFC: Sunderland
    Tottenham Hotspurs: Spurs
